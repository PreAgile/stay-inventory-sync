# https://docs.coderabbit.ai/configuration/
language: ko-KR

reviews:
  # 3일짜리 실험 저장소이므로 지적을 최대한 끌어내기 위해 assertive를 선택.
  # 장기 운영 저장소라면 chill로 시작하는 것이 일반적이다.
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle/wrapper/**"
    - "!**/*.lock"

  path_instructions:
    - path: "src/main/kotlin/**/inventory/**"
      instructions: |
        이 패키지는 재고 정합성의 핵심이다. 다음을 최우선으로 검토할 것.
        - 다중 행 락 획득 시 stay_date 오름차순 정렬이 보장되는가 (데드락 방지)
        - SELECT FOR UPDATE 범위 안에서 외부 I/O를 호출하지 않는가
        - 재고 차감/복원이 sold >= 0 AND sold <= total 불변식을 위반할 수 있는가
        - 체크아웃 당일이 재고 차감 대상에서 제외되었는가 ([check_in, check_out) 반개구간)
        성능 최적화 제안보다 정확성 위반 가능성을 우선 지적할 것.

    - path: "src/main/kotlin/**/outbox/**"
      instructions: |
        Outbox 패턴 구현부다.
        - outbox_event INSERT가 도메인 변경과 반드시 동일 트랜잭션 안에 있는가
        - at-least-once 전제 하에 중복 발행이 부작용을 중복시키지 않는가
        - 재시도 백오프가 next_attempt_at으로 관리되는가
        - 릴레이 폴링이 다중 인스턴스에서 안전한가 (SKIP LOCKED 여부)
        @TransactionalEventListener로 대체하자는 제안은 하지 말 것.
        이는 ADR-0003에서 명시적으로 기각된 대안이다.

    - path: "src/main/kotlin/**/channel/**"
      instructions: |
        외부 채널 어댑터다. 실제 OTA가 아닌 스텁이지만 계약은 실제 스펙을 모방한다.
        - 멱등키가 요청에 포함되는가
        - 429/5xx 응답이 재시도 가능 실패로 분류되는가
        - 레이트 리밋 초과가 영구 실패로 오분류되지 않는가

    - path: "src/main/kotlin/**/domain/**"
      instructions: |
        JPA 엔티티가 포함된 패키지다. Kotlin 특유의 함정을 우선 검토할 것.
        - 엔티티가 data class로 선언되었다면 반드시 지적할 것.
          equals/hashCode가 전체 프로퍼티 기반이라 지연 로딩 프록시 및
          영속성 컨텍스트의 동일성 판단과 충돌한다.
          엔티티는 일반 class + id 기반 equals/hashCode여야 한다.
        - 엔티티 컬렉션 프로퍼티가 var로 재할당 가능한가
        - when이 sealed 타입에 else로 뭉뚱그려져 망라성 검사가 무력화되었는가
        - !! 사용. 도메인 불변식이면 requireNotNull에 메시지를 붙여야 한다

    - path: "src/test/**"
      instructions: |
        Kotest FunSpec을 사용한다.
        - 테스트 이름이 "무엇을 증명하는가"를 서술하는가
        - 동시성 테스트에서 실제로 경합이 발생하도록 구성되었는가
          (CountDownLatch 등으로 동시 시작을 강제하는지)
        - Testcontainers 실제 PostgreSQL을 사용하는가 (H2 사용 시 반드시 지적)
        - 각 테스트 종료 시 불변식 검증이 수행되는가
        JUnit 전환이나 Arrange-Act-Assert 형식은 지적하지 말 것.
        Given-When-Then 주석 구조를 쓴다.

    - path: "docs/**"
      instructions: |
        설계 문서다. 코드 스타일 지적 대상이 아니다.
        - 문서의 주장이 실제 구현과 일치하지 않는 부분
        - ADR에서 "기각한 대안"의 근거가 부실한 부분
        이 두 가지만 지적할 것.

chat:
  auto_reply: true
