# 테스트에서는 Inbox 스케줄러를 끈다.
#
# 켜 두면 1초마다 폴링이 돌면서 각 스펙의 TRUNCATE 와 락을 다툰다. 더 나쁜 것은
# 웹훅 스펙에서 워커가 **테스트가 부르기 전에** 알림을 소화해 버리는 것이다 --
# 그러면 "적기만 하고 처리는 안 했다" 를 확인할 수 없다.
#
# 스케줄러가 도는 것 자체는 InboundWorkerSchedulerTest 가 이 값을 켜서 확인한다.
# 끄기만 하고 아무도 켜지 않으면 배선이 깨진 것을 영영 모른다.
inbox.worker.enabled=false

# 같은 이유로 Outbox 릴레이 스케줄러도 끈다. 켜 두면 T4 가 "마킹 직전 사망" 을
# 재현하는 사이에 스케줄러가 끼어들어 발행해 버린다.
# 배선은 OutboxRelaySchedulerTest 가 켜서 확인한다.
outbox.relay.enabled=false

# 재동기화 스케줄러도 끈다. 하루 한 번이라 테스트 중에 뜨지는 않지만,
# 컨텍스트가 뜨는 순간 첫 실행이 즉시 일어난다(fixedDelay 는 시작 직후 한 번 돈다).
# 배선은 InventoryResyncTest 가 켜서 확인한다.
resync.enabled=false
