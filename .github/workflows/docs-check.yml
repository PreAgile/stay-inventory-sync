name: Docs Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback './**/*.md'
          fail: false
